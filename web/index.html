<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090c12">
  <title>Ultron Web</title>
  <style>
    :root{color-scheme:dark;--bg:#090c12;--panel:#111722;--line:#263244;--text:#e8edf5;--muted:#9ba8ba;--gold:#ffc629;--red:#f04b55}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#1b2939,var(--bg) 55%);color:var(--text);font:15px/1.5 system-ui,Segoe UI,sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px}
    .shell{width:min(820px,100%);height:min(850px,calc(100vh - 40px));min-height:500px;background:#0e131c;border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 80px #0008}
    header{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}h1{font-size:17px;letter-spacing:.12em;margin:0}header small{color:var(--muted)}button{font:inherit;cursor:pointer;border:0;border-radius:10px;background:var(--gold);color:#17130a;padding:11px 16px;font-weight:700}button:disabled{opacity:.5;cursor:wait}.quiet{background:transparent;color:var(--muted);border:1px solid var(--line);padding:7px 11px}
    #login{margin:auto;width:min(370px,calc(100% - 36px));display:grid;gap:13px}#login h2{margin:0;font-size:24px}label{color:var(--muted);font-size:13px}input,textarea{width:100%;font:inherit;color:var(--text);background:#090d14;border:1px solid var(--line);border-radius:10px;padding:12px;outline:none}input:focus,textarea:focus{border-color:var(--gold)}.error{color:#ff858a;min-height:1.4em;margin:0;font-size:13px}
    #chat{flex:1;display:flex;flex-direction:column;min-height:0}#messages{overflow:auto;flex:1;padding:22px;display:flex;flex-direction:column;gap:14px}.bubble{max-width:85%;padding:12px 15px;border-radius:15px;white-space:pre-wrap;overflow-wrap:anywhere}.assistant{align-self:flex-start;background:#172130;border:1px solid #25344a}.user{align-self:flex-end;background:#4d3c0a;border:1px solid #84670d}.welcome{color:var(--muted);text-align:center;margin:auto;max-width:460px}.composer{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:end}.composer textarea{resize:none;min-height:46px;max-height:150px}.hint{padding:0 18px 10px;color:#78869a;font-size:12px}
    [hidden]{display:none!important}@media(max-width:560px){body{padding:0}.shell{height:100vh;min-height:0;border-radius:0;border:0}.bubble{max-width:94%}header{padding:15px}}
  </style>
</head>
<body>
  <main class="shell">
    <header><div><h1>ULTRON</h1><small>Private web chat</small></div><button id="logout" class="quiet" hidden>Sign out</button></header>
    <form id="login" hidden>
      <h2>Welcome back</h2><label for="password">Web access password</label><input id="password" type="password" autocomplete="current-password" required maxlength="256">
      <button id="loginButton">Sign in</button><p id="loginError" class="error" role="alert"></p>
    </form>
    <section id="chat" hidden aria-label="Chat with Ultron">
      <div id="messages" aria-live="polite"><div class="welcome">Ask Ultron anything. This hosted version chats online and cannot operate your local computer.</div></div>
      <p id="chatError" class="error" style="padding:0 18px;margin:0" role="alert"></p>
      <form class="composer" id="composer"><textarea id="message" placeholder="Message Ultron…" aria-label="Message Ultron" maxlength="2000" rows="1" required></textarea><button id="send" aria-label="Send message">Send</button></form>
      <div class="hint">Enter to send · Shift+Enter for a new line</div>
    </section>
  </main>
<script>
const loginForm=document.querySelector('#login'),chat=document.querySelector('#chat'),logoutButton=document.querySelector('#logout'),passwordInput=document.querySelector('#password'),messages=document.querySelector('#messages'),composer=document.querySelector('#composer'),messageInput=document.querySelector('#message'),sendButton=document.querySelector('#send');
let history=[];
async function request(path,body){const response=await fetch(path,{method:body?'POST':'GET',credentials:'same-origin',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});let data={};try{data=await response.json()}catch{}if(!response.ok){const error=new Error(data.detail||'Request failed.');error.status=response.status;throw error}return data}
function showChat(authed){loginForm.hidden=authed;chat.hidden=!authed;logoutButton.hidden=!authed;if(authed)messageInput.focus();else passwordInput.focus()}
function addBubble(role,text){const empty=messages.querySelector('.welcome');if(empty)empty.remove();const item=document.createElement('div');item.className=`bubble ${role}`;item.textContent=text;messages.append(item);messages.scrollTop=messages.scrollHeight;return item}
loginForm.addEventListener('submit',async event=>{event.preventDefault();const error=document.querySelector('#loginError'),button=document.querySelector('#loginButton');error.textContent='';button.disabled=true;try{await request('/api/login',{password:passwordInput.value});passwordInput.value='';showChat(true)}catch(e){error.textContent=e.message}finally{button.disabled=false}});
logoutButton.addEventListener('click',async()=>{try{await request('/api/logout',{})}catch{}history=[];messages.innerHTML='<div class="welcome">Ask Ultron anything. This hosted version chats online and cannot operate your local computer.</div>';showChat(false)});
composer.addEventListener('submit',async event=>{event.preventDefault();const text=messageInput.value.trim();if(!text||sendButton.disabled)return;document.querySelector('#chatError').textContent='';addBubble('user',text);messageInput.value='';messageInput.style.height='auto';sendButton.disabled=true;const pending=addBubble('assistant','Thinking…');try{const data=await request('/api/chat',{message:text,history});pending.textContent=data.reply;history.push({role:'user',content:text},{role:'assistant',content:data.reply});history=history.slice(-10);messages.scrollTop=messages.scrollHeight}catch(e){pending.remove();document.querySelector('#chatError').textContent=e.message;if(e.status===401)showChat(false)}finally{sendButton.disabled=false;messageInput.focus()}});
messageInput.addEventListener('input',()=>{messageInput.style.height='auto';messageInput.style.height=`${Math.min(messageInput.scrollHeight,150)}px`});messageInput.addEventListener('keydown',event=>{if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();composer.requestSubmit()}});
(async()=>{try{const data=await request('/api/session');showChat(data.authenticated)}catch{showChat(false)}})();
</script>
</body>
</html>
